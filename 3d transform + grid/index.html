<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>3d tranforms + grid</title>
</head>
<body>

    <div class="container flex">

        <div class="grid">
            <div class="item flex translate-X">translate-X</div>
            <div class="item flex translate-Y">translate-Y</div>
            <div class="item flex translate-Z">translate-Z</div>
            <div class="item flex rotate-X">rotate-X</div>
            <div class="item flex rotate-Y">rotate-Y</div>
            <div class="item flex rotate-Z">rotate-Z</div>
            <div class="item flex scale-X">scale-X</div>
            <div class="item flex scale-Y">Scale-Y</div>
            <div class="item flex scale-Z">Scale-Z</div>
        </div>

    </div>
    
</body>
</html>
